default_provider: openai
providers:
  openai:
    settings:
      enabled: true
      api_key: null
      api_base_url: https://api.openai.com/v1
      api_version: null
      organization: null
      timeout_seconds: 60.0
      max_retries: 2
      headers: {}
    default_model: primary
    models:
      primary:
        model_name: gpt-5.1-mini
        display_name: GPT 5.1 Mini
        temperature: 1.0
        top_p: 1.0
        max_tokens: 512
        timeout_seconds: 60.0
        stop_sequences: []
        metadata: {}
      fallback:
        model_name: gpt-4.1-mini
        display_name: GPT 4.1 Mini
        temperature: 0.7
        top_p: 1.0
        max_tokens: 512
        timeout_seconds: 60.0
        stop_sequences: []
        metadata: {}

[project]
name = "news-agent"
version = "0.1.0"
description = "News Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.9.2",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.0",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "lxml[html-clean]>=6.0.2",
    "newspaper3k>=0.2.8",
    "pydantic[settings]>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "tavily-python>=0.7.21",
    "tortoise-orm[asyncpg]>=0.25.3",
    "uvicorn>=0.40.0",
    "pydantic-settings>=2.12.0",
    "aiofiles>=25.1.0",
    "celery[redis]>=5.5.3",
    "pydantic-ai>=1.62.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "faker>=37.12.0",
    "mypy>=1.19.1",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
anyio_mode = "auto"
markers = [
    "slow: marks tests that run slowly or require external services",
]

[tool.coverage.run]
source = ["application", "core", "domain", "infrastructure"]
branch = true

[tool.coverage.html]
directory = "htmlcov"

[tool.aerich]
tortoise_orm = "core.config.config.tortoise_orm"
location = "./migrations"
src_folder = "./."
